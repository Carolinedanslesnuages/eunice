name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  action:
    name: L'action, sur un site d'essai
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Une page légère passe
        uses: ./
        with:
          config: test/fixtures/eunice.json
      # Outside a PR only: in a PR, this report would replace the one above in the comment.
      - name: Un budget dépassé bloque
        id: over-budget
        if: github.event_name != 'pull_request'
        uses: ./
        continue-on-error: true
        with:
          config: test/fixtures/eunice-budget-depasse.json
      - name: Vérifier que le budget dépassé a bien bloqué
        if: github.event_name != 'pull_request' && steps.over-budget.outcome != 'failure'
        shell: bash
        run: |
          echo "::error title=Eunice::le budget dépassé aurait dû faire échouer l'action."
          exit 1
